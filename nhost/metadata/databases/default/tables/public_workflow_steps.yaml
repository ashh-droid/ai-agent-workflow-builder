table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: organization
    using: {foreign_key_constraint_on: org_id}
  - name: workflow
    using:
      manual_configuration:
        column_mapping: {workflow_id: id, org_id: org_id}
        insertion_order: null
        remote_table: {name: workflows, schema: public}
select_permissions:
  - role: user
    permission:
      columns: [id,workflow_id,org_id,step_order,step_type,name,config,created_at,updated_at]
      filter:
        organization:
          members:
            user_id: {_eq: X-Hasura-User-Id}
