table:
  name: notifications
  schema: public
object_relationships:
  - name: organization
    using: {foreign_key_constraint_on: org_id}
select_permissions:
  - role: user
    permission:
      columns: [id,org_id,workflow_run_id,step_run_id,channel,payload,status,error,delivered_at,created_at,updated_at]
      filter:
        organization:
          members:
            user_id: {_eq: X-Hasura-User-Id}
event_triggers:
  - name: notification_created
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: '{{NHOST_FUNCTIONS_URL}}/events/notification-created'
    headers:
      - name: nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: true
      clear_older_than: 168
      paused: false
      schedule: 0 0 * * *
      timeout: 60
