table:
  name: organizations
  schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
  - name: runs
    using:
      manual_configuration:
        column_mapping: {id: org_id}
        insertion_order: null
        remote_table: {name: workflow_runs, schema: public}
select_permissions:
  - role: user
    permission:
      columns: [id,name,quota_limit,quota_used,quota_remaining,quota_reset_at,created_by,created_at,updated_at]
      filter:
        members:
          user_id: {_eq: X-Hasura-User-Id}
update_permissions:
  - role: user
    permission:
      columns: [name]
      filter:
        members:
          user_id: {_eq: X-Hasura-User-Id}
          role: {_eq: owner}
      check:
        members:
          user_id: {_eq: X-Hasura-User-Id}
          role: {_eq: owner}
