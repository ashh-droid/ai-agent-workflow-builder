table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: organization
    using:
      manual_configuration:
        column_mapping: {org_id: id}
        insertion_order: null
        remote_table: {name: organizations, schema: public}
  - name: workflow
    using:
      manual_configuration:
        column_mapping: {workflow_id: id, org_id: org_id}
        insertion_order: null
        remote_table: {name: workflows, schema: public}
select_permissions:
  - role: user
    permission:
      columns: [id,workflow_id,org_id,trigger_type,config,is_active,last_fired_at,created_at,updated_at]
      filter:
        organization:
          members:
            user_id: {_eq: X-Hasura-User-Id}
