name: Generate lockfiles

on:
  push:
    branches: [polish/submission-ready]
    paths:
      - .github/workflows/generate-lockfiles.yml

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/submission-ready
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix functions
      - name: Commit lockfiles
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json functions/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current"
            exit 0
          fi
          git commit -m "Add reproducible npm lockfiles"
          git push origin HEAD:polish/submission-ready
