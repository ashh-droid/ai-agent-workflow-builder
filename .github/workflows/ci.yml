name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Install function dependencies
        run: npm install --prefix functions
      - name: Install Nhost CLI
        run: curl -L https://raw.githubusercontent.com/nhost/nhost/main/cli/get.sh | sudo bash
      - name: Validate Nhost configuration
        run: |
          cat > .secrets <<'EOF'
          HASURA_GRAPHQL_ADMIN_SECRET = '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          HASURA_GRAPHQL_JWT_SECRET = 'abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
          NHOST_WEBHOOK_SECRET = 'fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210'
          GEMINI_API_KEY = 'ci-placeholder-gemini-key'
          GRAFANA_ADMIN_PASSWORD = 'ci-placeholder-grafana-password'
          EOF
          nhost config validate
          rm .secrets
      - name: Validate Action SDL
        run: |
          python3 -c "import tomllib; tomllib.load(open('nhost/nhost.toml','rb'))"
          node -e "const fs=require('fs'); const {parse}=require('graphql'); parse(fs.readFileSync('nhost/metadata/actions.graphql','utf8'));"
      - name: Validate PostgreSQL migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY DEFAULT gen_random_uuid());
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f nhost/migrations/default/1786270000000_workflow_engine/up.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f nhost/migrations/default/1786270000000_workflow_engine/down.sql
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Typecheck functions
        run: npm run typecheck:functions
      - name: Build Next.js app
        run: npm run build
