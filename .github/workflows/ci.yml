name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Install function dependencies
        run: npm install --prefix functions
      - name: Validate Nhost config and Action SDL
        run: |
          python3 -c "import tomllib; tomllib.load(open('nhost/nhost.toml','rb'))"
          node -e "const fs=require('fs'); const {parse}=require('graphql'); parse(fs.readFileSync('nhost/metadata/actions.graphql','utf8'));"
      - name: Validate PostgreSQL migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY DEFAULT gen_random_uuid());
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f nhost/migrations/default/1786270000000_workflow_engine/up.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f nhost/migrations/default/1786270000000_workflow_engine/down.sql
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Typecheck functions
        run: npm run typecheck:functions
      - name: Build Next.js app
        run: npm run build
